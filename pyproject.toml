[project]
name = "mellifon"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["flask>=3.1,<4", "python-dotenv>=1.2,<2", "argon2-cffi>=23,<26", "stripe>=12,<16", "imageio-ffmpeg>=0.6,<1", "soundfile>=0.13,<1", "waitress>=3,<4"]

[project.optional-dependencies]
worker = ["qwen-tts==0.1.1", "torch==2.10.0", "torchaudio==2.10.0"]
dev = ["playwright>=1.50,<2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

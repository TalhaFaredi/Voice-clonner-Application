# Same-origin hosting: static frontend + /api proxied to the loopback API.
# Terminate TLS here (e.g. certbot). Set TRUSTED_PROXY_COUNT=1 in backend/.env.
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    root /srv/sonora/frontend;
    index index.html;
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        # Overwrite (not append) so a client cannot inject its own forwarded chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /src/ { try_files $uri =404; }
    location /public/ { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location / { return 404; }
}
